<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Create your account - Restaurant System</title>

    <link rel="stylesheet" href="../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../css/components.css?v=1">
    <link rel="stylesheet" href="../css/style.css?v=2">
    <link rel="stylesheet" href="style.css?v=2">

    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>


<body>

    <main class="auth-shell">

        <!-- ============================================================
             Brand side
             ============================================================ -->
        <section class="auth-brand">

            <div class="auth-brand-inner">

                <a class="brand" href="../../index.html">
                    <span class="brand-mark" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 3v8a2 2 0 0 0 4 0V3"/>
                            <path d="M7 11v10"/>
                            <path d="M17 3c-1.7 1-2.5 2.8-2.5 5s.8 3.4 2.5 4v9"/>
                        </svg>
                    </span>
                    <span class="brand-text">
                        <strong style="color:#fff">UI Restaurant</strong>
                        <small>University of Ibadan</small>
                    </span>
                </a>

                <h1>Create your<br>account</h1>

                <p>
                    Order from the campus kitchen, track your food from stove to counter,
                    and pay the way that suits you.
                </p>

            </div>

        </section>


        <!-- ============================================================
             Form side
             ============================================================ -->
        <section class="auth-form-side">

            <div class="auth-form-inner">

                <h2>Sign up</h2>
                <p>It only takes a minute.</p>


                <form id="signup-form">

                    <div class="form-row">

                        <div class="form-group">
                            <label for="first-name">First name</label>
                            <input
                                type="text"
                                id="first-name"
                                placeholder="Bola"
                                autocomplete="given-name"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="last-name">Last name</label>
                            <input
                                type="text"
                                id="last-name"
                                placeholder="Adeleke"
                                autocomplete="family-name"
                                required
                            >
                        </div>

                    </div>


                    <div class="form-group">
                        <label for="phone">Phone number</label>
                        <input
                            type="tel"
                            id="phone"
                            placeholder="08012345678"
                            autocomplete="tel"
                        >
                    </div>


                    <div class="form-group">
                        <label for="email">Email</label>
                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="email"
                            required
                        >
                    </div>


                    <div class="form-row">

                        <div class="form-group">
                            <label for="password">Password</label>
                            <input
                                type="password"
                                id="password"
                                placeholder="At least 6 characters"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                        <div class="form-group">
                            <label for="confirm-password">Confirm password</label>
                            <input
                                type="password"
                                id="confirm-password"
                                placeholder="Repeat it"
                                autocomplete="new-password"
                                required
                            >
                        </div>

                    </div>


                    <button type="submit" id="signup-btn" class="save-btn full-width">
                        Create account
                    </button>


                    <p id="signup-message" role="status" aria-live="polite"></p>

                </form>


                <div class="signup-link">

                    <p>Already have an account?</p>

                    <a href="../../index.html">Sign in</a>

                </div>

            </div>

        </section>

    </main>


    <script src="../../js/api.js?v=1"></script>

    <script src="app.js?v=1"></script>

</body>

</html>
