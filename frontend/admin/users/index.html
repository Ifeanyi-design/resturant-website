<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>User Management - UI Restaurant</title>

    <link rel="stylesheet" href="../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../css/components.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>

<body>

    <div class="app-shell">

        <!-- Rendered by ../../js/shell.js -->
        <aside class="sidebar" id="app-sidebar"></aside>


        <div class="shell-main">

            <header class="shell-header">

                <div>
                    <h1>User Management</h1>
                    <p class="muted">Manage restaurant system users</p>
                </div>

                <div class="shell-header-actions">

                    <button type="button" id="nav-toggle" aria-label="Toggle navigation">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M3 12h18"/>
                                <path d="M3 18h18"/>
                            </svg>
                        </span>
                    </button>

                    <button onclick="loadUsers()" class="refresh-btn">
                        Refresh
                    </button>

                </div>

            </header>


            <main class="shell-content">

                <div id="message" role="status" aria-live="polite"></div>


                <!-- User form. app.js looks this up via .form-section. -->

                <div class="form-section panel">

                    <h2 id="form-title">Add User</h2>

                    <form id="user-form">

                        <input
                            type="hidden"
                            id="user_id"
                        >

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="first_name">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="first_name"
                                    placeholder="First name"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label for="last_name">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="last_name"
                                    placeholder="Last name"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label for="email">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                    placeholder="Email address"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label for="password">
                                    Password
                                </label>

                                <input
                                    type="password"
                                    id="password"
                                    placeholder="Password"
                                >

                                <span
                                    id="password-help"
                                    class="field-hint"
                                >
                                    Password must be at least 6 characters.
                                </span>
                            </div>


                            <div class="form-group">
                                <label for="role">
                                    Role
                                </label>

                                <select id="role" required>

                                    <option value="staff">
                                        Staff
                                    </option>

                                    <option value="admin">
                                        Admin
                                    </option>

                                </select>
                            </div>

                        </div>


                        <div class="form-actions">

                            <button type="submit" class="save-btn">
                                Save User
                            </button>

                            <button
                                type="button"
                                id="cancel-btn"
                                class="cancel-btn"
                                onclick="cancelEdit()"
                                style="display: none;"
                            >
                                Cancel
                            </button>

                        </div>

                    </form>

                </div>


                <!-- Users table -->

                <section class="panel">

                    <h3>
                        Users
                        <span class="hint">administrator and staff logins</span>
                    </h3>

                    <div class="table-container">

                        <table
                            data-tools
                            data-tools-placeholder="Search users..."
                        >

                            <thead>

                                <tr>
                                    <th>ID</th>
                                    <th>Name</th>
                                    <th>Email</th>
                                    <th>Role</th>
                                    <th>Created</th>
                                    <th>Actions</th>
                                </tr>

                            </thead>


                            <tbody id="users-table">

                                <tr>

                                    <td colspan="6">
                                        <p class="muted">Loading&hellip;</p>
                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </main>

        </div>

    </div>

    <div class="nav-scrim"></div>


    <script src="../../js/api.js?v=1"></script>

    <script src="../../js/shell.js?v=1"></script>

    <script src="../../js/table-tools.js?v=1"></script>

    <script src="app.js"></script>

</body>

</html>
