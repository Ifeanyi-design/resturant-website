<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Order Details - UI Restaurant</title>

    <link rel="stylesheet" href="../../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../../css/components.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">

</head>

<body>

    <div class="app-shell">

        <!-- Rendered by ../../../js/shell.js -->
        <aside class="sidebar" id="app-sidebar"></aside>

        <div class="shell-main">

            <header class="shell-header">

                <div>
                    <h1>Order Details</h1>
                    <p>A single order, its items and its next steps</p>
                </div>

                <div class="shell-header-actions">

                    <button type="button" id="nav-toggle" aria-label="Toggle navigation">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M3 12h18"/>
                                <path d="M3 18h18"/>
                            </svg>
                        </span>
                    </button>

                </div>

            </header>

            <main class="shell-content">

                <div id="message" role="status" aria-live="polite"></div>


                <section class="panel order-info">

                    <h3>
                        Order Information
                        <span class="hint">who ordered, when, and what it is worth</span>
                    </h3>

                    <p><strong>Order ID:</strong> <span id="order-id">-</span></p>

                    <p><strong>Customer:</strong> <span id="customer-name">-</span></p>

                    <p><strong>Date:</strong> <span id="order-date">-</span></p>

                    <p><strong>Status:</strong> <span id="status">-</span></p>

                    <p><strong>Total:</strong> ₦<span id="total">0</span></p>

                    <div id="process-section"></div>

                </section>


                <section class="panel items-section">

                    <h3>
                        Order Items
                        <span class="hint">each line on this order</span>
                    </h3>

                    <div class="table-container">

                        <table>

                            <thead>

                                <tr>
                                    <th>Item</th>
                                    <th>Quantity</th>
                                    <th>Price</th>
                                    <th>Subtotal</th>
                                </tr>

                            </thead>

                            <tbody id="items-table-body">

                                <tr>
                                    <td colspan="4">
                                        <p class="muted">Loading&hellip;</p>
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </main>

        </div>

    </div>

    <div class="nav-scrim"></div>


    <script src="../../../js/api.js?v=1"></script>

    <script src="../../../js/shell.js?v=1"></script>

    <script src="../../../js/table-tools.js?v=1"></script>

    <script src="app.js?v=2"></script>

</body>
</html>
