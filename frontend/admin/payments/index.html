<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Payment Management - UI Restaurant</title>

    <link rel="stylesheet" href="../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../css/components.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>

<body>

    <div class="app-shell">

        <!-- Rendered by ../../js/shell.js -->
        <aside class="sidebar" id="app-sidebar"></aside>


        <div class="shell-main">

            <header class="shell-header">

                <div>
                    <h1>Payment Management</h1>
                    <p class="muted">Review and approve customer payments</p>
                </div>

                <div class="shell-header-actions">

                    <button type="button" id="nav-toggle" aria-label="Toggle navigation">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M3 12h18"/>
                                <path d="M3 18h18"/>
                            </svg>
                        </span>
                    </button>

                    <button
                        id="refresh-btn"
                        class="refresh-btn"
                    >
                        Refresh
                    </button>

                </div>

            </header>


            <main class="shell-content">

                <div id="message" role="status" aria-live="polite"></div>


                <!-- Payment list -->

                <section class="panel">

                    <h3>
                        Payments
                        <span class="hint">review and approve customer transfers</span>
                    </h3>

                    <div class="table-container">

                        <table
                            data-tools
                            data-tools-placeholder="Search payments..."
                        >

                            <thead>

                                <tr>
                                    <th>Payment ID</th>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Amount</th>
                                    <th>Method</th>
                                    <th>Status</th>
                                    <th>Action</th>
                                </tr>

                            </thead>

                            <tbody id="payments-body">

                                <tr>
                                    <td colspan="7">
                                        <p class="muted">Loading&hellip;</p>
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </main>

        </div>

    </div>

    <div class="nav-scrim"></div>


    <script src="../../js/api.js?v=1"></script>

    <script src="../../js/shell.js?v=1"></script>

    <script src="../../js/table-tools.js?v=1"></script>

    <script src="app.js"></script>

</body>

</html>
