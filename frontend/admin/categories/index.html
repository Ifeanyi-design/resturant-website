<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Category Management - UI Restaurant</title>

    <link rel="stylesheet" href="../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../css/components.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>

<body>

    <div class="app-shell">

        <!-- Rendered by ../../js/shell.js -->
        <aside class="sidebar" id="app-sidebar"></aside>

        <div class="shell-main">

            <header class="shell-header">

                <div>
                    <h1>Category Management</h1>
                    <p>Group the menu into sections</p>
                </div>

                <div class="shell-header-actions">

                    <button type="button" id="nav-toggle" aria-label="Toggle navigation">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M3 12h18"/>
                                <path d="M3 18h18"/>
                            </svg>
                        </span>
                    </button>

                    <button id="add-category-btn" class="add-btn">+ Add Category</button>

                </div>

            </header>

            <main class="shell-content">

                <div id="message" role="status" aria-live="polite"></div>

                <section class="panel">

                    <h3>
                        Categories
                        <span class="hint">the sections your menu is grouped into</span>
                    </h3>

                    <div class="table-container">

                        <table data-tools data-tools-placeholder="Search categories...">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Category name</th>
                                    <th>Description</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>

                            <tbody id="category-table-body">
                                <tr>
                                    <td colspan="4">
                                        <p class="muted">Loading&hellip;</p>
                                    </td>
                                </tr>
                            </tbody>
                        </table>

                    </div>

                </section>


                <section id="category-form-section" class="form-section panel" style="display: none;">

                    <h2>Add Category</h2>

                    <form id="category-form">

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="category-name">Category name</label>
                                <input type="text" id="category-name" required>
                            </div>

                            <div class="form-group span-2">
                                <label for="description">Description</label>
                                <textarea id="description"></textarea>
                                <span class="field-hint">Optional</span>
                            </div>

                        </div>

                        <div class="form-actions">
                            <button type="submit" class="save-btn">Save Category</button>
                            <button type="button" id="cancel-btn" class="cancel-btn">Cancel</button>
                        </div>

                        <p id="form-message"></p>

                    </form>

                </section>

            </main>

        </div>

    </div>

    <div class="nav-scrim"></div>


    <script src="../../js/api.js?v=1"></script>

    <script src="../../js/shell.js?v=1"></script>

    <script src="../../js/table-tools.js?v=1"></script>

    <script src="app.js"></script>

</body>
</html>
