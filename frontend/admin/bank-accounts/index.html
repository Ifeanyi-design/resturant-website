<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bank Accounts - UI Restaurant</title>

    <link rel="stylesheet" href="../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../css/components.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>

<body>

    <div class="app-shell">

        <!-- Rendered by ../../js/shell.js -->
        <aside class="sidebar" id="app-sidebar"></aside>


        <div class="shell-main">

            <header class="shell-header">

                <div>
                    <h1>Restaurant Bank Accounts</h1>
                    <p class="muted">
                        Manage bank accounts customers can use for bank transfers.
                    </p>
                </div>

                <div class="shell-header-actions">

                    <button type="button" id="nav-toggle" aria-label="Toggle navigation">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M3 12h18"/>
                                <path d="M3 18h18"/>
                            </svg>
                        </span>
                    </button>

                    <button
                        class="add-btn"
                        onclick="showAddForm()"
                    >
                        + Add Bank Account
                    </button>

                </div>

            </header>


            <main class="shell-content">

                <div id="message" role="status" aria-live="polite"></div>


                <!-- Form, shown and hidden by app.js via the .hidden class -->

                <section
                    id="form-section"
                    class="form-section panel hidden"
                >

                    <h2 id="form-title">
                        Add Bank Account
                    </h2>

                    <form id="account-form">

                        <input
                            type="hidden"
                            id="account-id"
                        >

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="bank-name">
                                    Bank Name
                                </label>

                                <input
                                    type="text"
                                    id="bank-name"
                                    placeholder="e.g. Zenith Bank"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label for="account-name">
                                    Account Name
                                </label>

                                <input
                                    type="text"
                                    id="account-name"
                                    placeholder="e.g. Restaurant System"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label for="account-number">
                                    Account Number
                                </label>

                                <input
                                    type="text"
                                    id="account-number"
                                    placeholder="Enter account number"
                                    required
                                >

                                <span class="field-hint">
                                    The number shown to customers paying by transfer.
                                </span>
                            </div>


                            <div class="form-group">
                                <label class="checkbox" for="is-active">

                                    <input
                                        type="checkbox"
                                        id="is-active"
                                        checked
                                    >

                                    Active

                                </label>

                                <span class="field-hint">
                                    Customers can only transfer to active accounts.
                                </span>
                            </div>

                        </div>


                        <div class="form-actions">

                            <button
                                type="submit"
                                class="save-btn"
                            >
                                Save Account
                            </button>

                            <button
                                type="button"
                                class="cancel-btn"
                                onclick="hideForm()"
                            >
                                Cancel
                            </button>

                        </div>

                    </form>

                </section>


                <!-- Accounts -->

                <section class="panel">

                    <div id="accounts-container">

                        <p class="muted">
                            Loading&hellip;
                        </p>

                    </div>

                </section>

            </main>

        </div>

    </div>

    <div class="nav-scrim"></div>


    <script src="../../js/api.js?v=1"></script>

    <script src="../../js/shell.js?v=1"></script>

    <script src="../../js/table-tools.js?v=1"></script>

    <script src="app.js?v=1"></script>

</body>

</html>
