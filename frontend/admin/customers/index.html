<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Customer Management - UI Restaurant</title>

    <link rel="stylesheet" href="../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../css/components.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">

</head>

<body>

    <div class="app-shell">

        <!-- Rendered by ../../js/shell.js -->
        <aside class="sidebar" id="app-sidebar"></aside>


        <div class="shell-main">

            <header class="shell-header">

                <div>
                    <h1>Customer Management</h1>
                    <p class="muted">Manage restaurant customers</p>
                </div>

                <div class="shell-header-actions">

                    <button type="button" id="nav-toggle" aria-label="Toggle navigation">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/>
                                <path d="M3 12h18"/>
                                <path d="M3 18h18"/>
                            </svg>
                        </span>
                    </button>

                    <button
                        id="refresh-btn"
                        class="refresh-btn"
                    >
                        Refresh
                    </button>

                    <button id="add-customer-btn" class="add-btn">
                        + Add Customer
                    </button>

                </div>

            </header>


            <main class="shell-content">

                <div id="message" role="status" aria-live="polite"></div>


                <!-- Customer form, revealed by app.js -->

                <section id="customer-form-section" class="form-section panel">

                    <h2 id="form-title">Add Customer</h2>

                    <form id="customer-form">

                        <div class="form-grid">

                            <div class="form-group">
                                <label for="first-name">
                                    First Name
                                </label>

                                <input
                                    type="text"
                                    id="first-name"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label for="last-name">
                                    Last Name
                                </label>

                                <input
                                    type="text"
                                    id="last-name"
                                    required
                                >
                            </div>


                            <div class="form-group">
                                <label for="phone">
                                    Phone
                                </label>

                                <input
                                    type="text"
                                    id="phone"
                                >
                            </div>


                            <div class="form-group">
                                <label for="email">
                                    Email
                                </label>

                                <input
                                    type="email"
                                    id="email"
                                >
                            </div>

                        </div>


                        <div class="form-actions">

                            <button
                                type="submit"
                                class="save-btn"
                            >
                                Save Customer
                            </button>

                            <button
                                type="button"
                                id="cancel-btn"
                                class="cancel-btn"
                            >
                                Cancel
                            </button>

                        </div>


                        <p id="form-message"></p>

                    </form>

                </section>


                <!-- Customer list -->

                <section class="panel">

                    <h3>
                        Customers
                        <span class="hint">contact details for regular diners</span>
                    </h3>

                    <div class="table-container">

                        <table
                            data-tools
                            data-tools-placeholder="Search customers..."
                        >

                            <thead>

                                <tr>
                                    <th>ID</th>
                                    <th>First Name</th>
                                    <th>Last Name</th>
                                    <th>Phone</th>
                                    <th>Email</th>
                                    <th>Actions</th>
                                </tr>

                            </thead>

                            <tbody id="customer-table-body">

                                <tr>
                                    <td colspan="6">
                                        <p class="muted">Loading&hellip;</p>
                                    </td>
                                </tr>

                            </tbody>

                        </table>

                    </div>

                </section>

            </main>

        </div>

    </div>

    <div class="nav-scrim"></div>


    <script src="../../js/api.js?v=1"></script>

    <script src="../../js/shell.js?v=1"></script>

    <script src="../../js/table-tools.js?v=1"></script>

    <script src="app.js"></script>

</body>

</html>
