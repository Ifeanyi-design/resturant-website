<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Sign in - Restaurant System</title>

    <link rel="stylesheet" href="css/tokens.css?v=1">
    <link rel="stylesheet" href="css/components.css?v=1">
    <link rel="stylesheet" href="css/style.css?v=2">

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

</head>


<body>

    <main class="auth-shell">

        <!-- ============================================================
             Brand side
             ============================================================ -->
        <section class="auth-brand">

            <div class="auth-brand-inner">

                <p class="auth-eyebrow">
                    <span class="icon icon-sm" aria-hidden="true">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                             stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                            <path d="M5 3v8a2 2 0 0 0 4 0V3"/>
                            <path d="M7 11v10"/>
                            <path d="M17 3c-1.7 1-2.5 2.8-2.5 5s.8 3.4 2.5 4v9"/>
                        </svg>
                    </span>
                    Restaurant System
                </p>

                <h1>Good food,<br>ordered simply.</h1>

                <p>
                    Browse the menu, track your order through the kitchen, and pay by
                    card or bank transfer.
                </p>

            </div>

        </section>


        <!-- ============================================================
             Sign-in form
             ============================================================ -->
        <section class="auth-form-side">

            <div class="auth-form-inner">

                <h2>Sign in</h2>
                <p>Use the account type you registered with.</p>


                <form id="login-form">

                    <div class="form-group">
                        <label for="account-type">Login as</label>

                        <select id="account-type" required>
                            <option value="customer">Customer</option>
                            <option value="staff">Admin / Staff</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="email">Email</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="you@example.com"
                            autocomplete="username"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">Password</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="Your password"
                            autocomplete="current-password"
                            required
                        >
                    </div>


                    <button type="submit" class="save-btn full-width">
                        Sign in
                    </button>


                    <p id="login-message" role="status" aria-live="polite"></p>

                </form>


                <div class="signup-link">

                    <p>Don't have a customer account?</p>

                    <a href="customer/signup/index.html">Create one</a>

                </div>


                <p class="track-link">
                    Just following an order?
                    <a href="track/index.html">Track it without signing in</a>
                </p>

            </div>

        </section>

    </main>


    <script src="js/api.js?v=1"></script>

    <script src="js/app.js?v=2"></script>

</body>

</html>
