<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Details - UI Restaurant</title>
    <link rel="stylesheet" href="../../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../../css/components.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="../../../assets/favicon.svg">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="app-sidebar"></aside>
        <div class="shell-main">
            <header class="shell-header">
                <div>
                    <h1>Order Details</h1>
                    <p>Full breakdown of a single order.</p>
                </div>
                <div class="shell-header-actions">
                    <button type="button" id="nav-toggle" aria-label="Toggle navigation">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>
                            </svg>
                        </span>
                    </button>
                </div>
            </header>
            <main class="shell-content">
                <div id="message" role="status" aria-live="polite"></div>

                <section class="panel">

                    <h3>
                        Order summary
                        <span class="hint">status, items and total</span>
                    </h3>

                    <div id="order-details">
                        <p class="muted">Loading order…</p>
                    </div>

                </section>

            </main>
        </div>
    </div>
    <div class="nav-scrim"></div>
    <script src="../../../js/api.js?v=1"></script>
    <script src="../../../js/shell.js?v=1"></script>
    <script src="../../../js/table-tools.js?v=1"></script>
    <script src="app.js?v=1"></script>
</body>
</html>
