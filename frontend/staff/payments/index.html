<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payments - UI Restaurant</title>
    <link rel="stylesheet" href="../../css/tokens.css?v=1">
    <link rel="stylesheet" href="../../css/components.css?v=1">
    <link rel="stylesheet" href="style.css?v=2">
    <link rel="icon" type="image/svg+xml" href="../../assets/favicon.svg">
</head>
<body>
    <div class="app-shell">
        <aside class="sidebar" id="app-sidebar"></aside>
        <div class="shell-main">
            <header class="shell-header">
                <div>
                    <h1>Payments</h1>
                    <p>View customer payment records.</p>
                </div>
                <div class="shell-header-actions">
                    <button type="button" id="nav-toggle" aria-label="Toggle navigation">
                        <span class="icon" aria-hidden="true">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                 stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M3 6h18"/><path d="M3 12h18"/><path d="M3 18h18"/>
                            </svg>
                        </span>
                    </button>
                    <button type="button" class="refresh-btn" onclick="loadPayments()">Refresh</button>
                </div>
            </header>
            <main class="shell-content">
                <div id="message" role="status" aria-live="polite"></div>

                <section class="panel">

                    <h3>
                        Payments
                        <span class="hint">method, amount and status</span>
                    </h3>

                    <div class="table-container">
                        <table data-tools data-tools-placeholder="Search payments…">
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Order ID</th>
                                    <th>Customer</th>
                                    <th>Payment Method</th>
                                    <th>Amount</th>
                                    <th>Status</th>
                                    <th>Date</th>
                                </tr>
                            </thead>

                            <tbody id="payments-table">
                                <tr>
                                    <td colspan="7" class="muted">Loading payments…</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </section>

            </main>
        </div>
    </div>
    <div class="nav-scrim"></div>
    <script src="../../js/api.js?v=1"></script>
    <script src="../../js/shell.js?v=1"></script>
    <script src="../../js/table-tools.js?v=1"></script>
    <script src="app.js?v=1"></script>
</body>
</html>
